name: Build, test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Canonical URL, sitemap and Open Graph tags are built from this. Change it if you use a custom domain.
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      # Optional repository secret: comma-separated private terms that must never appear in published output.
      BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content, build, check the site
        run: npm run build && npm run check
      - name: Unit and integration tests
        run: npm test
      - name: End-to-end tests (real Chrome)
        run: CHROME_PATH=$(which google-chrome) npm run test:e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
